<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas Onírico</title>
<meta name="description" content="Generador bilingüe de criaturas, entes, paisajes y arquitecturas surrealistas de sueño y pesadilla, con prompts para IA.">
<meta name="theme-color" content="#E6E7EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11131C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atlas Onírico">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: catálogo de láminas — controles a la izquierda, la lámina generada (imagen, nombre, descripción, rasgos, prompt) a la derecha */
:root{
  --bg:#E6E7EC; --surface:#F3F3F6; --ink:#1A1C27; --muted:#5B5F72; --line:#C8CAD4;
  --accent:#2E3A9A; --accent-ink:#FFFFFF; --dream:#7C8FD6; --night:#7A1F2C; --lockbg:#DCDFF2;
  --f-display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-body:"Spectral", Georgia, "Times New Roman", serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11131C; --surface:#191C28; --ink:#E8E4D9; --muted:#9C9EAD; --line:#2D3144;
    --accent:#A9B5FF; --accent-ink:#11131C; --dream:#9AA8F0; --night:#C8616E; --lockbg:#262B45; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11131C; --surface:#191C28; --ink:#E8E4D9; --muted:#9C9EAD; --line:#2D3144;
  --accent:#A9B5FF; --accent-ink:#11131C; --dream:#9AA8F0; --night:#C8616E; --lockbg:#262B45; color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);padding-block:28px 72px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:32px}
.brand h1{font-family:var(--f-display);font-weight:500;font-style:italic;font-size:clamp(2rem,4.6vw,3rem);line-height:1;margin:0;letter-spacing:-.01em}
.brand p{margin:.5rem 0 0;color:var(--muted);max-width:56ch;font-size:.98rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:transparent;padding:.3rem .8rem;border-radius:999px;cursor:pointer;font-family:var(--f-mono);font-size:.78rem;letter-spacing:.06em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.grid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:44px;align-items:start}
@media (max-width:880px){.grid{grid-template-columns:minmax(0,1fr);gap:28px}}

aside.controls{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);display:flex;flex-direction:column;gap:26px}
@media (max-width:880px){aside.controls{position:static}}
.label{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.55rem}

.modes{display:flex;flex-direction:column;gap:2px}
@media (max-width:880px){.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}}
.mode{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid transparent;background:transparent;padding:.55rem .75rem;border-radius:6px;cursor:pointer}
.mode b{font-family:var(--f-display);font-weight:500;font-size:1.25rem;line-height:1.1}
.mode span{font-size:.82rem;color:var(--muted)}
.mode:hover{background:var(--surface)}
.mode[aria-pressed="true"]{background:var(--surface);border-color:var(--line)}
.mode[aria-pressed="true"] b{font-style:italic;color:var(--accent)}

.range{width:100%;appearance:none;-webkit-appearance:none;height:6px;border-radius:999px;background:linear-gradient(90deg,var(--dream),var(--night));outline-offset:6px}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--surface);border:2px solid var(--ink);cursor:pointer}
.range::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--surface);border:2px solid var(--ink);cursor:pointer}
.range-ends{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-top:.45rem;font-style:italic}

.levels{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.levels button{border:0;background:var(--surface);padding:.5rem .2rem;cursor:pointer;font-size:.88rem}
.levels button+button{border-left:1px solid var(--line)}
.levels button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.levels.is-off{opacity:.45;pointer-events:none}

select.sel{width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--surface)}

.go{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:.6rem .9rem;cursor:pointer;font-size:.92rem}
.btn:hover{border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn-primary{flex:1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-family:var(--f-display);font-style:italic;font-size:1.2rem;padding:.65rem 1rem}
.btn-primary:hover{border-color:var(--accent);filter:brightness(1.08)}
.hint{font-size:.78rem;color:var(--muted);margin:.5rem 0 0;font-family:var(--f-mono);letter-spacing:.02em}

.saved-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:280px;overflow:auto}
.saved-list li{display:flex;align-items:center;gap:4px}
.saved-list .open{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:.35rem .5rem;border-radius:5px;cursor:pointer;display:flex;flex-direction:column}
.saved-list .open:hover{background:var(--surface)}
.saved-list .open b{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved-list .open span{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.empty{color:var(--muted);font-size:.9rem;font-style:italic;margin:0}

/* Resultado */
.result{min-width:0;display:flex;flex-direction:column;gap:34px}
.plate{margin:0}
.plate canvas{display:block;width:100%;aspect-ratio:21/8;max-width:100%;border-radius:3px;background:var(--line)}
.plate figcaption{display:flex;justify-content:space-between;gap:12px;margin-top:.55rem;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.titlebar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.titlebar .names{min-width:0}
.name{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:clamp(2.4rem,6vw,4rem);line-height:.95;margin:0;letter-spacing:-.015em;overflow-wrap:anywhere}
.epithet{margin:.55rem 0 0;font-family:var(--f-display);font-variant:small-caps;letter-spacing:.06em;font-size:1.15rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font-family:var(--f-display);font-size:1.25rem;padding:.25rem .8rem;border:1px solid var(--ink);border-radius:999px}
.chip+.chip::before{content:none}

.prose{font-size:clamp(1.12rem,1.6vw,1.28rem);line-height:1.62;max-width:62ch;margin:0;text-wrap:pretty}
.prose::first-letter{font-family:var(--f-display);font-size:3.1em;float:left;line-height:.82;padding:.08em .1em 0 0;font-style:italic;color:var(--accent)}
.prose-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

section.block h2{font-family:var(--f-mono);font-weight:500;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 .35rem}
section.block .sub{margin:0 0 .9rem;color:var(--muted);font-size:.9rem;font-style:italic}
.traits{border-top:1px solid var(--line)}
.trait{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--line)}
.trait .t-label{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.trait .t-text{min-width:0}
.trait.is-locked .t-text{font-style:italic}
.trait.is-locked{background:linear-gradient(90deg,var(--lockbg),transparent 70%)}
.t-actions{display:flex;gap:4px}
.ib{width:34px;height:34px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:6px;cursor:pointer;color:var(--muted)}
.ib:hover{border-color:var(--line);color:var(--ink);background:var(--surface)}
.ib[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.ib svg{width:16px;height:16px}
@media (max-width:560px){
  .trait{grid-template-columns:minmax(0,1fr) auto}
  .trait .t-label{grid-column:1 / -1}
}

.palette{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.sw{display:flex;flex-direction:column;align-items:flex-start;gap:5px;border:0;background:transparent;padding:0;cursor:pointer}
.sw i{display:block;width:64px;height:44px;border-radius:3px;border:1px solid rgba(127,127,127,.25)}
.sw span{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}

.prompt-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:.7rem}
.prompt-box{font-family:var(--f-mono);font-size:.86rem;line-height:1.6;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}

.fade{animation:fade .45s ease-out}
@keyframes fade{from{opacity:.35;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

/* Ilustrar */
.ext{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ext a{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:.6rem .75rem}
.ext a:hover{border-color:var(--ink)}
.ext a b{font-weight:500}
.ext a span{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gen-panel{margin-top:22px;border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--surface)}
.gen-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.gen-top .label{margin:0}
.gen-row{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.gen-row .sel{width:auto;flex:0 1 200px}
.gen-row .btn-primary{flex:1 1 200px}
.keyform{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:14px;border:1px dashed var(--line);border-radius:6px;background:var(--bg)}
.keyform label{display:flex;flex-direction:column;gap:6px;min-width:0}
.keyform input{width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-family:var(--f-mono);font-size:.85rem}
.keyform .full{grid-column:1 / -1}
.keyform .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.keyform a{color:var(--accent)}
.status{margin:0;font-size:.92rem;color:var(--muted);font-style:italic;min-height:1.4em}
.status.err{color:var(--night);font-style:normal}
.img-out{margin:0;display:flex;flex-direction:column;gap:10px}
.img-out img{display:block;width:100%;height:auto;border-radius:4px;border:1px solid var(--line);background:var(--bg)}
.img-out figcaption{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.img-out a.btn{text-decoration:none;color:var(--ink)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.thumbs button{flex:0 0 auto;border:1px solid var(--line);border-radius:4px;padding:0;background:none;cursor:pointer;width:72px;height:72px;overflow:hidden}
.thumbs button[aria-current="true"]{border-color:var(--accent);outline:1px solid var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.spin{display:inline-block;width:.9em;height:.9em;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-.1em;margin-right:.4em}
@keyframes sp{to{transform:rotate(360deg)}}

/* Barra inferior en móvil */
.mbar{display:none}
@media (max-width:880px){
  .mbar{display:flex;gap:8px;position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:5}
  .mbar .btn-primary{flex:1}
  .wrap{padding-bottom:120px}
  .hint.desk{display:none}
}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:.8rem;padding:.5rem .9rem;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (max-width:880px){.toast{bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 id="brandName">Atlas Onírico</h1>
      <p id="tagline"></p>
    </div>
    <div class="seg" role="group" aria-label="Idioma / Language">
      <button id="langEs" data-lang="es">ES</button>
      <button id="langEn" data-lang="en">EN</button>
    </div>
  </header>

  <div class="grid">
    <aside class="controls">
      <div>
        <span class="label" data-i="whatLabel"></span>
        <div class="modes" id="modes"></div>
      </div>

      <div>
        <label class="label" for="mood" data-i="mood"></label>
        <input class="range" type="range" id="mood" min="0" max="100" value="55">
        <div class="range-ends"><span data-i="dream"></span><span data-i="nightmare"></span></div>
      </div>

      <div>
        <span class="label" data-i="level"></span>
        <div class="levels" id="levels" role="group"></div>
      </div>

      <div>
        <label class="label" for="infl" data-i="infl"></label>
        <select class="sel" id="infl"></select>
      </div>

      <div>
        <div class="go">
          <button class="btn" id="backBtn" title="">←</button>
          <button class="btn btn-primary" id="genBtn"></button>
        </div>
        <p class="hint desk" data-i="spaceHint"></p>
      </div>

      <div>
        <span class="label" data-i="saved"></span>
        <ul class="saved-list" id="savedList"></ul>
      </div>
    </aside>

    <main class="result" id="result">
      <figure class="plate">
        <canvas id="plate" aria-hidden="true"></canvas>
        <figcaption><span id="plateNo"></span><span id="plateInfl"></span></figcaption>
      </figure>

      <div>
        <div class="titlebar">
          <div class="names">
            <h2 class="name" id="name"></h2>
            <p class="epithet" id="epithet"></p>
          </div>
          <button class="btn" id="saveBtn"></button>
        </div>
        <div class="chips" id="chips" hidden></div>
      </div>

      <div>
        <p class="prose" id="prose"></p>
        <div class="prose-actions">
          <button class="btn" id="copyDesc"></button>
        </div>
      </div>

      <section class="block">
        <h2 data-i="traits"></h2>
        <p class="sub" data-i="traitsHint"></p>
        <div class="traits" id="traits"></div>
      </section>

      <section class="block">
        <h2 data-i="notes"></h2>
        <div class="traits" id="notes"></div>
        <div class="palette" id="palette"></div>
      </section>

      <section class="block">
        <div class="prompt-head">
          <h2 data-i="prompt" style="margin:0"></h2>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <div class="seg" role="group" aria-label="Prompt">
              <button id="pEs" data-plang="es">ES</button>
              <button id="pEn" data-plang="en">EN</button>
            </div>
            <button class="btn" id="copyPrompt"></button>
          </div>
        </div>
        <pre class="prompt-box" id="promptBox"></pre>
        <p class="hint" data-i="promptHint"></p>
      </section>

      <section class="block" id="illus">
        <h2 data-i="illus"></h2>
        <p class="sub" data-i="illusHint"></p>
        <div class="ext" id="extLinks"></div>

        <div class="gen-panel">
          <div class="gen-top">
            <span class="label" data-i="inPage"></span>
            <button class="btn" id="keyToggle" aria-expanded="false" aria-controls="keyForm"></button>
          </div>

          <form class="keyform" id="keyForm" hidden autocomplete="off">
            <label><span class="label" data-i="provider"></span>
              <select class="sel" id="provider"></select>
            </label>
            <label><span class="label" data-i="model"></span>
              <input id="model" list="modelList" spellcheck="false">
              <datalist id="modelList"></datalist>
            </label>
            <label class="full"><span class="label" data-i="apiKey"></span>
              <input id="apiKey" type="password" spellcheck="false" autocapitalize="off">
            </label>
            <div class="full row">
              <button class="btn" type="submit" id="keySave"></button>
              <button class="btn" type="button" id="keyForget"></button>
              <a id="keyLink" href="#" target="_blank" rel="noopener"></a>
            </div>
            <p class="hint full" data-i="keyNote" style="margin:0"></p>
          </form>

          <div class="gen-row">
            <select class="sel" id="aspect" aria-label="Formato"></select>
            <button class="btn btn-primary" id="genImg"></button>
          </div>
          <p class="status" id="genStatus" role="status" aria-live="polite"></p>
          <figure class="img-out" id="imgOut" hidden>
            <img id="imgEl" alt="">
            <figcaption><span id="imgMeta"></span><a class="btn" id="imgDl" download></a></figcaption>
          </figure>
          <div class="thumbs" id="thumbs" hidden></div>
        </div>
      </section>
    </main>
  </div>
</div>
<div class="mbar">
  <button class="btn" id="mBack" aria-label="">←</button>
  <button class="btn btn-primary" id="mGen"></button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Textos de interfaz ---------- */
const UI = {
  es:{ brand:"Atlas Onírico",
    tagline:"Generador de criaturas, entes, paisajes y arquitecturas de sueño y pesadilla. Una idea por lámina, para empezar a dibujar.",
    whatLabel:"Qué soñar",
    modes:{creature:"Criatura",entity:"Ente",landscape:"Paisaje",structure:"Estructura",spark:"Chispa"},
    modeHint:{creature:"Seres deformes, bestias de sueño",entity:"Presencias sin cuerpo fijo",landscape:"Lugares imposibles",structure:"Arquitectura onírica",spark:"Cuatro palabras para cruzar"},
    mood:"Tono", dream:"Sueño", nightmare:"Pesadilla", level:"Rareza", levels:["Leve","Notable","Delirante"],
    infl:"Referencia pictórica", random:"Al azar", none:"Sin referencia",
    gen:"Soñar otra", back:"Volver a la anterior", saved:"Guardadas",
    noSaved:"Aún no has guardado ninguna. Pulsa Guardar cuando una idea te sirva.",
    save:"Guardar", savedOk:"Guardada ✓", copyDesc:"Copiar descripción", copy:"Copiar prompt", copied:"Copiado al portapapeles",
    copyFail:"Texto seleccionado: cópialo con Ctrl+C",
    traits:"Rasgos", traitsHint:"Bloquea lo que te guste y vuelve a soñar el resto.",
    notes:"Notas para dibujar", prompt:"Prompt para IA",
    promptHint:"Los generadores de imagen suelen entender mejor el inglés.",
    plate:"Lám.", reroll:"Cambiar este rasgo", lock:"Bloquear este rasgo",
    spaceHint:"Barra espaciadora: soñar otra", del:"Borrar", hexCopied:"Color copiado", savedToast:"Guardada en tu atlas",
    illus:"Ilustrar", illusHint:"Gratis: cada botón copia el prompt y abre el generador. Si dice «pega», mantén pulsado el cuadro de texto y pega.",
    prefilled:"Prompt ya escrito", paste:"Pega el prompt", chatPrefix:"Genera una imagen con este prompt: ",

/* Modos: [clave, lista, ¿se repite según la rareza?] */
const MODES = {
 creature:{ slots:[["form"],["material"],["head"],["legs"],["anom","anom",true],["move"],["behav"],["habitat"]], epi:"cEpi" },
 entity:{ slots:[["what"],["perc"],["sign"],["wants"],["eff","eff",true],["habitat"]], epi:"eEpi" },
 landscape:{ slots:[["time"],["ground"],["sky"],["landmark"],["detail","detail",true],["atmos"]], epi:"lEpi" },
 structure:{ slots:[["type"],["smat"],["loc"],["feat","feat",true],["inside"],["inhab"]], epi:"sEpi" },
 spark:{ slots:[["obj"],["animal"],["part"],["feel"]], epi:"pEpi", noLevel:true }
};
const MODE_ORDER = ["creature","entity","landscape","structure","spark"];

/* ---------- Utilidades ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = () => Math.floor(Math.random()*2**31);
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const lc = s => s.charAt(0).toLowerCase()+s.slice(1);
const $ = id => document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function joinList(arr, L){
  if(arr.length<2) return arr.join("");
  const last = arr[arr.length-1];
  let conj = L===0 ? (/^h?i[^aeiouáéíóú]/i.test(last) ? " e " : " y ") : (arr.length>2 ? ", and " : " and ");
  return arr.slice(0,-1).join(", ") + conj + last;
}
function roman(n){const m=[[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];let r="";for(const[v,s]of m){while(n>=v){r+=s;n-=v}}return r}
const PRE=["Vel","Mor","Oss","Lith","Cal","Nyx","Ser","Umb","Quel","Ast","Zor","Hel","Mal","Ond","Ir","Ves","Gal","Ther","Orn","Sib","Mel","Cor","Lun","Ab","Is","Ul","Pyr","Sel","Var","Em"];
const MID=["a","e","i","o","u","ae","io","ia","","ar","el","on"];
const SUF=["drix","mora","nth","lune","goth","phel","ara","ith","usa","ombe","ex","oria","ul","yne","ast","ira","ost","elle","ax","uria","ond"];
function makeName(seed){const r=mulberry32(seed);const p=a=>a[Math.floor(r()*a.length)];let n=p(PRE)+p(MID)+p(SUF);return n.replace(/(.)\1\1/g,"$1$1")}

/* ---------- Estado ---------- */
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const prefs = store.get("atlas-prefs",{});
const state = {
  lang: prefs.lang || ((navigator.language||"es").toLowerCase().startsWith("es") ? "es" : "en"),
  plang: prefs.plang || "en",
  mode: prefs.mode && MODES[prefs.mode] ? prefs.mode : "creature",
  mood: typeof prefs.mood==="number" ? prefs.mood : 55,
  level: [1,2,3].includes(prefs.level) ? prefs.level : 2,
  infl: prefs.infl ?? "random",
  m: {}, /* por modo: {picks, locks} */
  history: [],
  saved: store.get("atlas-saved",[])
};
function savePrefs(){store.set("atlas-prefs",{lang:state.lang,plang:state.plang,mode:state.mode,mood:state.mood,level:state.level,infl:state.infl})}
const L = () => state.lang==="es"?0:1;
const tr = k => UI[state.lang][k];

function slotKeys(mode){
  const def=MODES[mode]; const out=[];
  for(const [key,list,multi] of def.slots){
    if(multi && !def.noLevel){ for(let i=0;i<state.level;i++) out.push({key:key+i, base:key, list:list||key}); }
    else out.push({key, base:key, list:list||key});
  }
  return out;
}
function noteKeys(){
  const k=[{key:"comp",base:"comp",list:"comp"},{key:"light",base:"light",list:"light"},{key:"medium",base:"medium",list:"medium"}];
  if(state.infl==="random") k.push({key:"infl",base:"infl",list:"__infl"});
  return k;
}
function weight(item){
  if(item.length<3 || typeof item[2]!=="number") return 1;
  const d=item[2]/2 - state.mood/100;
  return Math.exp(-(d*d)/(2*0.35*0.35));
}
function pickFrom(listName, avoid){
  if(listName==="__infl"){let i;do{i=Math.floor(Math.random()*INFL.length)}while(avoid.has(i)&&INFL.length>avoid.size);return i}
  const list=D[listName];
  const idx=list.map((_,i)=>i).filter(i=>!avoid.has(i));
  const pool=idx.length?idx:list.map((_,i)=>i);
  const ws=pool.map(i=>weight(list[i])); const tot=ws.reduce((a,b)=>a+b,0);
  let r=Math.random()*tot;
  for(let j=0;j<pool.length;j++){r-=ws[j];if(r<=0)return pool[j]}
  return pool[pool.length-1];
}
function ms(){ if(!state.m[state.mode]) state.m[state.mode]={picks:{},locks:{}}; return state.m[state.mode]; }
function allKeys(){ return [{key:"name",base:"name"},{key:"epi",base:"epi",list:MODES[state.mode].epi}, ...slotKeys(state.mode), ...noteKeys()]; }

function assign(force, onlyKey){
  const s=ms();
  for(const k of allKeys()){
    if(onlyKey && k.key!==onlyKey) continue;
    const has = s.picks[k.key]!==undefined;
    if(has && (s.locks[k.key] || !force)) continue;
    if(k.key==="name"){ s.picks.name=rnd(); continue; }
    const avoid=new Set();
    for(const o of allKeys()) if(o.list===k.list && o.key!==k.key && s.picks[o.key]!==undefined) avoid.add(s.picks[o.key]);
    if(onlyKey && has) avoid.add(s.picks[k.key]);
    s.picks[k.key]=pickFrom(k.list, avoid);
  }
}
function snapshot(){ return {mode:state.mode, picks:{...ms().picks}}; }
function generate(){
  if(Object.keys(ms().picks).length){ state.history.push(snapshot()); if(state.history.length>30) state.history.shift(); }
  assign(true); render(true);
}

/* ---------- Composición del texto ---------- */
function curInfl(){
  if(state.infl==="none") return null;
  if(state.infl==="random") return INFL[ms().picks.infl] || INFL[0];
  return INFL[+state.infl] || null;
}
function moodBucket(){ return state.mood<34?0:state.mood<67?1:2; }
function compose(li){
  const p=ms().picks;
  const v=k=>{const it=allKeys().find(x=>x.key===k); return D[it.list][p[k]][li]};
  const multi=base=>slotKeys(state.mode).filter(k=>k.base===base).map(k=>v(k.key));
  const es=li===0; let prose="", frags=[];
  switch(state.mode){
   case "creature":{
     const a=multi("anom");
     prose = es
      ? `${cap(v("form"))}, con el cuerpo hecho de ${v("material")}. En lugar de cabeza tiene ${v("head")}. Se sostiene sobre ${v("legs")}. Tiene ${joinList(a,0)}. Se mueve ${v("move")}. ${v("behav")} Habita en ${v("habitat")}.`
      : `${cap(v("form"))}, its body made of ${v("material")}. Instead of a head, it has ${v("head")}. It stands on ${v("legs")}. It has ${joinList(a,1)}. It moves ${v("move")}. ${v("behav")} It dwells in ${v("habitat")}.`;
     frags = es
      ? ["diseño de criatura surrealista y onírica", v("form"), `cuerpo hecho de ${v("material")}`, `${v("head")} en lugar de cabeza`, `sobre ${v("legs")}`, ...a.map(x=>"con "+x), `en ${v("habitat")}`]
      : ["surreal dreamlike creature design", v("form"), `body made of ${v("material")}`, `${v("head")} instead of a head`, `standing on ${v("legs")}`, ...a.map(x=>"with "+x), `in ${v("habitat")}`];
     break; }
   case "entity":{
     const e=multi("eff");
     prose = es
      ? `Es ${v("what")}. ${v("perc")} Su llegada se anuncia con ${v("sign")}. ${v("wants")} Donde pasa, ${joinList(e,0)}. Suele aparecer en ${v("habitat")}.`
      : `It is ${v("what")}. ${v("perc")} Its arrival is heralded by ${v("sign")}. ${v("wants")} Wherever it passes, ${joinList(e,1)}. It tends to appear in ${v("habitat")}.`;
     frags = es
      ? ["aparición surrealista y etérea", v("what"), ...e, `en ${v("habitat")}`]
      : ["surreal ethereal apparition", v("what"), ...e, `in ${v("habitat")}`];
     break; }
   case "landscape":{
     const d=multi("detail");
     const pre = es?["A lo lejos, ","Más cerca, ","Justo a tus pies, "]:["In the distance, ","Closer, ","Right at your feet, "];
     const dl = d.map((x,i)=>pre[i]+x+".").join(" ");
     prose = es
      ? `${v("time")}. El suelo es ${v("ground")}. El cielo es ${v("sky")}. En el centro se alza ${v("landmark")}. ${dl} ${v("atmos")}`
      : `${v("time")}. The ground is ${v("ground")}. The sky is ${v("sky")}. At its centre rises ${v("landmark")}. ${dl} ${v("atmos")}`;
     frags = es
      ? ["paisaje surrealista y onírico", lc(v("time")), `el suelo es ${v("ground")}`, `el cielo es ${v("sky")}`, `en el centro, ${v("landmark")}`, ...d]
      : ["surreal dreamlike landscape", lc(v("time")), `the ground is ${v("ground")}`, `the sky is ${v("sky")}`, `${v("landmark")} rising at the centre`, ...d];
     break; }
   case "structure":{
     const f=multi("feat");
     prose = es
      ? `${v("type")} de ${v("smat")}. Se encuentra ${v("loc")}. Tiene ${joinList(f,0)}. Dentro, ${v("inside")}. ${v("inhab")}`
      : `${v("type")} made of ${v("smat")}. It stands ${v("loc")}. It has ${joinList(f,1)}. Inside, ${v("inside")}. ${v("inhab")}`;
     frags = es
      ? ["arquitectura surrealista y onírica", `${lc(v("type"))} de ${v("smat")}`, v("loc"), ...f.map(x=>"con "+x), `dentro, ${v("inside")}`]
      : ["surreal dreamlike architecture", `${lc(v("type"))} made of ${v("smat")}`, v("loc"), ...f.map(x=>"with "+x), `inside, ${v("inside")}`];
     break; }
   case "spark":{
     prose = es
      ? `Dibuja un ser que sea mitad ${v("obj")} y mitad ${v("animal")}, con ${v("part")}, y que transmita ${v("feel")}.`
      : `Draw a being that is half ${v("obj")}, half ${v("animal")}, with ${v("part")}, and that conveys ${v("feel")}.`;
     frags = es
      ? [`criatura híbrida surrealista, mitad ${v("obj")} y mitad ${v("animal")}`, `con ${v("part")}`, `que transmite ${v("feel")}`]
      : [`surreal hybrid creature, half ${v("obj")}, half ${v("animal")}`, `with ${v("part")}`, `conveying ${v("feel")}`];
     break; }
  }
  const inf=curInfl();
  frags.push(MOOD_KW[moodBucket()][li]);
  if(inf) frags.push(inf.kw[li]);
  frags.push(v("comp"), v("light"), v("medium"), es?"muy detallado, calidad pictórica":"highly detailed, painterly");
  return {prose, prompt: frags.join(", ")};
}

/* ---------- Lámina (canvas) ---------- */
function lum(hex){const n=parseInt(hex.slice(1),16);const r=n>>16&255,g=n>>8&255,b=n&255;return .2126*r+.7152*g+.0722*b}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16&255,g=n>>8&255,b=n&255;r=Math.round(r*f);g=Math.round(g*f);b=Math.round(b*f);return`rgb(${Math.min(255,r)},${Math.min(255,g)},${Math.min(255,b)})`}
function hashPicks(){const s=JSON.stringify(ms().picks)+state.mode+state.infl;let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function palette(){const inf=curInfl();return inf?inf.pal:MOOD_PAL[moodBucket()]}
function drawPlate(){
  const cv=$("plate"); const dpr=Math.min(window.devicePixelRatio||1,2);
  const W=Math.max(300,cv.clientWidth); const H=W*8/21;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0);
  const r=mulberry32(hashPicks());
  const pal=[...palette()].sort((a,b)=>lum(b)-lum(a)); /* claro → oscuro */
  const hz=H*(0.5+r()*0.2);
  const sky=c.createLinearGradient(0,0,0,hz);
  sky.addColorStop(0,pal[2]); sky.addColorStop(.75,pal[1]); sky.addColorStop(1,pal[0]);
  c.fillStyle=sky; c.fillRect(0,0,W,hz);
  /* astro */
  if(r()<.75){c.globalAlpha=.85;c.fillStyle=r()<.5?pal[0]:shade(pal[0],1.1);c.beginPath();c.arc(W*(.15+r()*.7),hz*(.2+r()*.45),H*(.04+r()*.07),0,Math.PI*2);c.fill();c.globalAlpha=1}
  /* suelo */
  const gr=c.createLinearGradient(0,hz,0,H);
  gr.addColorStop(0,pal[1]); gr.addColorStop(.35,pal[3]); gr.addColorStop(1,pal[4]);
  c.fillStyle=gr; c.fillRect(0,hz,W,H-hz);
  c.strokeStyle="rgba(255,255,255,.18)"; c.lineWidth=1; c.beginPath(); c.moveTo(0,hz+.5); c.lineTo(W,hz+.5); c.stroke();
  /* formas biomórficas con sombras largas */
  const dir=r()<.5?-1:1; const n=3+Math.floor(r()*4);
  const items=[];
  for(let i=0;i<n;i++){ const depth=r(); items.push({x:W*(.06+r()*.88), y:hz+(H-hz)*(.12+depth*.78), s:H*(.05+depth*.16+r()*.05), col:pal[Math.floor(r()*4)], tall:r()<.35, seed:r()}); }
  items.sort((a,b)=>a.y-b.y);
  for(const it of items){
    const len=it.s*(4+r()*5);
    c.fillStyle="rgba(10,8,12,.32)";
    c.beginPath(); c.ellipse(it.x+dir*len/2, it.y, len/2, it.s*.13, 0, 0, Math.PI*2); c.fill();
    const rr=mulberry32(Math.floor(it.seed*1e9));
    const k=9, pts=[]; const hx=it.s*.55, hy=it.s*(it.tall?1.5:.75); const cy=it.y-hy*(it.tall?1.05:.8);
    for(let j=0;j<k;j++){const a=j/k*Math.PI*2; const rad=.65+rr()*.55; pts.push([it.x+Math.cos(a)*hx*rad, cy+Math.sin(a)*hy*rad]);}
    if(it.tall){ c.strokeStyle=shade(it.col,.55); c.lineWidth=Math.max(1,it.s*.05); c.beginPath(); c.moveTo(it.x,it.y); c.lineTo(it.x,cy); c.stroke(); }
    const g=c.createLinearGradient(it.x-dir*hx,cy-hy,it.x+dir*hx,cy+hy);
    g.addColorStop(0,shade(it.col,1.18)); g.addColorStop(1,shade(it.col,.62));
    c.fillStyle=g; c.beginPath();
    const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
    let m0=mid(pts[k-1],pts[0]); c.moveTo(m0[0],m0[1]);
    for(let j=0;j<k;j++){const p=pts[j], q=pts[(j+1)%k], m=mid(p,q); c.quadraticCurveTo(p[0],p[1],m[0],m[1]);}
    c.fill();
    if(rr()<.4){ c.fillStyle=pal[4]; c.beginPath(); c.arc(it.x+hx*.15, cy-hy*.15, Math.max(1.5,it.s*.07), 0, Math.PI*2); c.fill(); }
  }
  /* grano */
  const img=c.getImageData(0,0,cv.width,cv.height); const d=img.data; const gr2=mulberry32(7);
  for(let i=0;i<d.length;i+=4){const v=(gr2()-.5)*14; d[i]+=v; d[i+1]+=v; d[i+2]+=v;}
  c.putImageData(img,0,0);
}

const ICON_LOCK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>';
const ICON_OPEN='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 4.9-.7"/></svg>';

function textFor(k){
  const p=ms().picks;
  if(k.key==="name") return makeName(p.name);
  if(k.list==="__infl") return INFL[p.infl].n;
  return D[k.list][p[k.key]][L()];
}
function traitRow(k){
  const locked=!!ms().locks[k.key];
  const lab=LABELS[k.base][L()];
  return `<div class="trait${locked?" is-locked":""}"><span class="t-label">${esc(lab)}</span><span class="t-text">${esc(textFor(k))}</span><span class="t-actions"><button class="ib" data-reroll="${k.key}" title="${esc(tr("reroll"))}" aria-label="${esc(tr("reroll"))}: ${esc(lab)}">${ICON_RE}</button><button class="ib" data-lock="${k.key}" aria-pressed="${locked}" title="${esc(tr("lock"))}" aria-label="${esc(tr("lock"))}: ${esc(lab)}">${locked?ICON_LOCK:ICON_OPEN}</button></span></div>`;
}
function render(animate){
  assign(false);
  const li=L(); const p=ms().picks;
  const {prose}=compose(li); const {prompt}=compose(state.plang==="es"?0:1);
  $("name").textContent=makeName(p.name);
  $("epithet").textContent=D[MODES[state.mode].epi][p.epi][li];
  $("prose").textContent=prose;
  $("promptBox").textContent=prompt;
  const plateNo = (p.name % 300)+1;
  $("plateNo").textContent=`${tr("plate")} ${roman(plateNo)} · ${UI[state.lang].modes[state.mode]}`;
  const inf=curInfl(); $("plateInfl").textContent = inf ? inf.n : tr("none");
  const chips=$("chips");
  if(state.mode==="spark"){ chips.hidden=false; chips.innerHTML=["obj","animal","part","feel"].map(k=>`<span class="chip">${esc(cap(D[k][p[k]][li]))}</span>`).join(""); }
  else chips.hidden=true;
  $("traits").innerHTML=[{key:"name",base:"name"},{key:"epi",base:"epi",list:MODES[state.mode].epi},...slotKeys(state.mode)].map(traitRow).join("");
  $("notes").innerHTML=noteKeys().map(traitRow).join("") + (state.infl!=="random" && inf ? `<div class="trait"><span class="t-label">${esc(LABELS.infl[li])}</span><span class="t-text">${esc(inf.n)}</span><span></span></div>` : "");
  $("palette").innerHTML=palette().map(h=>`<button class="sw" data-hex="${h}" title="${esc(tr("hexCopied"))}"><i style="background:${h}"></i><span>${h}</span></button>`).join("");
  updateSaveBtn();
  $("backBtn").disabled = $("mBack").disabled = !state.history.some(h=>h.mode===state.mode);
  renderExt();
  drawPlate();
  if(animate){ const el=$("result"); el.classList.remove("fade"); void el.offsetWidth; el.classList.add("fade"); }
}

function renderChrome(){
  const u=UI[state.lang];
  document.documentElement.lang=state.lang;
  $("brandName").textContent=u.brand;
  $("tagline").textContent=u.tagline;
  document.querySelectorAll("[data-i]").forEach(el=>{el.textContent=u[el.dataset.i]});
  $("langEs").setAttribute("aria-pressed",state.lang==="es"); $("langEn").setAttribute("aria-pressed",state.lang==="en");
  $("pEs").setAttribute("aria-pressed",state.plang==="es"); $("pEn").setAttribute("aria-pressed",state.plang==="en");
  $("modes").innerHTML=MODE_ORDER.map(m=>`<button class="mode" data-mode="${m}" aria-pressed="${state.mode===m}"><b>${esc(u.modes[m])}</b><span>${esc(u.modeHint[m])}</span></button>`).join("");
  $("levels").innerHTML=u.levels.map((t,i)=>`<button data-level="${i+1}" aria-pressed="${state.level===i+1}">${esc(t)}</button>`).join("");
  $("levels").classList.toggle("is-off", !!MODES[state.mode].noLevel);
  $("levels").setAttribute("aria-label",u.level);
  const sel=$("infl");
  sel.innerHTML=`<option value="random">${esc(u.random)}</option><option value="none">${esc(u.none)}</option>`+INFL.map((x,i)=>`<option value="${i}">${esc(x.n)}</option>`).join("");
  sel.value=String(state.infl);
  $("mood").value=state.mood;
  $("genBtn").textContent=u.gen;
  $("backBtn").title=u.back; $("backBtn").setAttribute("aria-label",u.back);
  $("copyDesc").textContent=u.copyDesc; $("copyPrompt").textContent=u.copy;
  $("mGen").textContent=u.gen; $("mBack").setAttribute("aria-label",u.back);
  document.title=u.brand;
  renderSaved();
  renderImgChrome();
}

/* ---------- Guardadas ---------- */
function curKey(){return state.mode+"|"+JSON.stringify(ms().picks)+"|"+state.level}
function updateSaveBtn(){const on=state.saved.some(s=>s.key===curKey());const b=$("saveBtn");b.textContent=on?tr("savedOk"):tr("save");b.setAttribute("aria-pressed",on)}
function renderSaved(){
  const ul=$("savedList");
  if(!state.saved.length){ul.innerHTML=`<li><p class="empty">${esc(tr("noSaved"))}</p></li>`;return}
  ul.innerHTML=state.saved.map((s,i)=>`<li><button class="open" data-open="${i}"><b>${esc(makeName(s.picks.name))}</b><span>${esc(UI[state.lang].modes[s.mode])}</span></button><button class="ib" data-del="${i}" title="${esc(tr("del"))}" aria-label="${esc(tr("del"))}: ${esc(makeName(s.picks.name))}">×</button></li>`).join("");
}

/* ---------- Copiar ---------- */
let toastT;
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1600)}
function selectEl(el){try{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}}
function copyText(txt, el){
  try{
    navigator.clipboard.writeText(txt).then(()=>toast(tr("copied")),()=>{ if(el) selectEl(el); toast(tr("copyFail")); });
  }catch(e){ if(el) selectEl(el); toast(tr("copyFail")); }
}

/* ---------- Ilustrar: generadores externos ---------- */
const EXT = [
  {n:"ChatGPT", url:p=>"https://chatgpt.com/?q="+encodeURIComponent(tr("chatPrefix")+p), pre:true},
  {n:"Bing Image Creator", url:p=>"https://www.bing.com/images/create?q="+encodeURIComponent(p.slice(0,480)), pre:true},
  {n:"Gemini", url:()=>"https://gemini.google.com/app", pre:false},
  {n:"Ideogram", url:()=>"https://ideogram.ai/", pre:false},
  {n:"Leonardo.ai", url:()=>"https://app.leonardo.ai/image-generation", pre:false}
];
function renderExt(){
  const p=$("promptBox").textContent;
  $("extLinks").innerHTML=EXT.map((x,i)=>`<a href="${esc(x.url(p))}" target="_blank" rel="noopener" data-ext="${i}"><b>${esc(x.n)}</b><span>${esc(x.pre?tr("prefilled"):tr("paste"))}</span></a>`).join("");
}
$("extLinks").addEventListener("click",e=>{
  if(!e.target.closest("[data-ext]")) return;
  /* no se cancela la navegación: copia y deja que el enlace abra la pestaña */
  try{ navigator.clipboard.writeText($("promptBox").textContent).then(()=>toast(tr("copied")),()=>{}); }catch(err){}
});

/* ---------- Ilustrar: generación dentro de la página ---------- */
const PROVIDERS = {
  pollinations:{n:"Pollinations", keyUrl:"https://enter.pollinations.ai/keys", models:["zimage","flux","klein","gptimage","gpt-image-2"], def:"zimage"},
  openai:{n:"OpenAI", keyUrl:"https://platform.openai.com/api-keys", models:["gpt-image-1-mini","gpt-image-1.5","gpt-image-2"], def:"gpt-image-1-mini"},
  fal:{n:"fal.ai", keyUrl:"https://fal.ai/dashboard/keys", models:["fal-ai/flux/schnell","fal-ai/flux/dev","fal-ai/flux-pro/v1.1"], def:"fal-ai/flux/schnell"}
};
const ASPECTS = {
  land:{poll:[1344,768], openai:"1536x1024", fal:"landscape_16_9"},
  square:{poll:[1024,1024], openai:"1024x1024", fal:"square_hd"},
  port:{poll:[768,1344], openai:"1024x1536", fal:"portrait_16_9"}
};
const img = Object.assign({provider:"pollinations", keys:{}, models:{}, aspect:"land"}, store.get("atlas-img",{}));
if(!PROVIDERS[img.provider]) img.provider="pollinations";
if(!ASPECTS[img.aspect]) img.aspect="land";
const gallery=[]; let shown=-1; let busy=false;
function saveImgCfg(){store.set("atlas-img",img)}
function curModel(){return img.models[img.provider]||PROVIDERS[img.provider].def}

function renderImgChrome(){
  const u=UI[state.lang];
  $("provider").innerHTML=Object.entries(PROVIDERS).map(([k,v])=>`<option value="${k}">${esc(v.n)}</option>`).join("");
  $("provider").value=img.provider;
  $("modelList").innerHTML=PROVIDERS[img.provider].models.map(m=>`<option value="${esc(m)}"></option>`).join("");
  $("model").value=curModel();
  $("apiKey").value=img.keys[img.provider]||"";
  $("keySave").textContent=u.keySave; $("keyForget").textContent=u.keyForget;
  $("keyLink").href=PROVIDERS[img.provider].keyUrl; $("keyLink").textContent=`${u.keyGet} ${PROVIDERS[img.provider].n} ↗`;
  $("keyToggle").textContent=$("keyForm").hidden?u.config:u.hideConfig;
  $("aspect").innerHTML=Object.keys(ASPECTS).map(k=>`<option value="${k}">${esc(u.aspects[k])}</option>`).join("");
  $("aspect").value=img.aspect;
  $("genImg").textContent=u.genImg;
  $("imgDl").textContent=u.download;
}
function setStatus(msg, err){const s=$("genStatus");s.classList.toggle("err",!!err);s.innerHTML=msg}
async function apiError(r){
  let detail="";
  try{const j=await r.json(); detail=(j.error&&(j.error.message||j.error))||j.detail||j.message||"";}catch(e){}
  if(typeof detail!=="string") detail=JSON.stringify(detail);
  const map={401:"errKey",403:"errKey",402:"errPay",429:"errRate"};
  const e=new Error(map[r.status]?tr(map[r.status]):`${tr("errOther")} (${r.status})${detail?": "+detail.slice(0,200):""}`);
  return e;
}
async function toBlobUrl(url){
  try{const r=await fetch(url); if(!r.ok) throw 0; return URL.createObjectURL(await r.blob());}catch(e){return url}
}
async function generateImage(){
  if(busy) return;
  const key=img.keys[img.provider];
  if(!key){ $("keyForm").hidden=false; renderImgChrome(); setStatus(esc(tr("needKey")),true); $("apiKey").focus(); return; }
  const prompt=$("promptBox").textContent, model=curModel(), asp=ASPECTS[img.aspect];
  busy=true; $("genImg").disabled=true; setStatus(`<span class="spin" aria-hidden="true"></span>${esc(tr("generating"))}`);
  const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),180000);
  try{
    let src;
    if(img.provider==="pollinations"){
      const [w,h]=asp.poll; const seed=Math.floor(Math.random()*2147483647);
      const url=`https://gen.pollinations.ai/image/${encodeURIComponent(prompt)}?model=${encodeURIComponent(model)}&width=${w}&height=${h}&seed=${seed}`;
      const r=await fetch(url,{headers:{Authorization:"Bearer "+key},signal:ctrl.signal});
      if(!r.ok) throw await apiError(r);
      src=URL.createObjectURL(await r.blob());
    } else if(img.provider==="openai"){
      const r=await fetch("https://api.openai.com/v1/images/generations",{method:"POST",signal:ctrl.signal,
        headers:{Authorization:"Bearer "+key,"Content-Type":"application/json"},
        body:JSON.stringify({model,prompt,size:asp.openai,n:1})});
      if(!r.ok) throw await apiError(r);
      const j=await r.json(); const d=j.data&&j.data[0];
      if(!d) throw new Error(tr("errOther"));
      src=d.b64_json?"data:image/png;base64,"+d.b64_json:await toBlobUrl(d.url);
    } else {
      const r=await fetch("https://fal.run/"+model.replace(/^\/+/,""),{method:"POST",signal:ctrl.signal,
        headers:{Authorization:"Key "+key,"Content-Type":"application/json"},
        body:JSON.stringify({prompt,image_size:asp.fal,num_images:1})});
      if(!r.ok) throw await apiError(r);
      const j=await r.json(); const u=j.images&&j.images[0]&&j.images[0].url;
      if(!u) throw new Error(tr("errOther"));
      src=await toBlobUrl(u);
    }
    gallery.unshift({src, name:$("name").textContent, meta:`${PROVIDERS[img.provider].n} · ${model}`});
    showImage(0);
    setStatus(esc(tr("done")));
  }catch(e){
    const msg = e.name==="AbortError" ? tr("errTimeout") : (e instanceof TypeError ? tr("errNet") : e.message);
    setStatus(esc(msg),true);
  }finally{
    clearTimeout(timer); busy=false; $("genImg").disabled=false;
  }
}
function showImage(i){
  shown=i; const g=gallery[i]; if(!g) return;
  $("imgOut").hidden=false;
  $("imgEl").src=g.src; $("imgEl").alt=g.name;
  $("imgMeta").textContent=`${g.name} · ${g.meta}`;
  $("imgDl").href=g.src; $("imgDl").download=`${g.name.toLowerCase()}-${gallery.length-i}.png`;
  const th=$("thumbs"); th.hidden=gallery.length<2;
  th.innerHTML=gallery.map((x,j)=>`<button data-th="${j}" aria-current="${j===i}" aria-label="${esc(x.name)}"><img src="${esc(x.src)}" alt=""></button>`).join("");
}

$("keyToggle").onclick=()=>{const f=$("keyForm");f.hidden=!f.hidden;$("keyToggle").setAttribute("aria-expanded",!f.hidden);renderImgChrome()};
$("provider").onchange=e=>{img.provider=e.target.value;saveImgCfg();renderImgChrome()};
$("model").onchange=e=>{const v=e.target.value.trim();if(v)img.models[img.provider]=v;else delete img.models[img.provider];saveImgCfg()};
$("aspect").onchange=e=>{img.aspect=e.target.value;saveImgCfg()};
$("keyForm").onsubmit=e=>{
  e.preventDefault();
  const v=$("apiKey").value.trim(); const m=$("model").value.trim();
  if(m) img.models[img.provider]=m;
  if(v){img.keys[img.provider]=v;saveImgCfg();toast(tr("keySaved"));setStatus("");$("keyForm").hidden=true;renderImgChrome();}
};
$("keyForget").onclick=()=>{delete img.keys[img.provider];saveImgCfg();$("apiKey").value="";toast(tr("keyForgot"))};
$("genImg").onclick=generateImage;
$("thumbs").onclick=e=>{const b=e.target.closest("[data-th]");if(b)showImage(+b.dataset.th)};

/* ---------- Eventos ---------- */
$("langEs").onclick=()=>{state.lang="es";savePrefs();renderChrome();render()};
$("langEn").onclick=()=>{state.lang="en";savePrefs();renderChrome();render()};
$("pEs").onclick=()=>{state.plang="es";savePrefs();renderChrome();render()};
$("pEn").onclick=()=>{state.plang="en";savePrefs();renderChrome();render()};
$("modes").onclick=e=>{const b=e.target.closest("[data-mode]");if(!b)return;state.mode=b.dataset.mode;savePrefs();renderChrome();render(true)};
$("levels").onclick=e=>{const b=e.target.closest("[data-level]");if(!b)return;state.level=+b.dataset.level;savePrefs();renderChrome();render()};
$("mood").oninput=e=>{state.mood=+e.target.value;savePrefs();};
$("mood").onchange=()=>render();
$("infl").onchange=e=>{state.infl=e.target.value==="random"||e.target.value==="none"?e.target.value:+e.target.value;savePrefs();render()};
$("genBtn").onclick=generate;
$("mGen").onclick=generate;
$("mBack").onclick=()=>$("backBtn").click();
$("backBtn").onclick=()=>{
  for(let i=state.history.length-1;i>=0;i--){ if(state.history[i].mode===state.mode){ const h=state.history.splice(i,1)[0]; ms().picks=h.picks; render(true); return; } }
};
function onTraitClick(e){
  const rb=e.target.closest("[data-reroll]"), lb=e.target.closest("[data-lock]");
  if(rb){ const k=rb.dataset.reroll; state.history.push(snapshot()); const s=ms(); const was=s.locks[k]; s.locks[k]=false; assign(true,k); s.locks[k]=was; render(); }
  if(lb){ const k=lb.dataset.lock; const s=ms(); s.locks[k]=!s.locks[k]; render(); }
}
$("traits").onclick=onTraitClick; $("notes").onclick=onTraitClick;
$("palette").onclick=e=>{const b=e.target.closest("[data-hex]");if(b)copyText(b.dataset.hex,null)};
$("copyDesc").onclick=()=>{copyText($("name").textContent+" — "+$("epithet").textContent+"\n\n"+$("prose").textContent,$("prose"))};
$("copyPrompt").onclick=()=>copyText($("promptBox").textContent,$("promptBox"));
$("saveBtn").onclick=()=>{
  const key=curKey(); const i=state.saved.findIndex(s=>s.key===key);
  if(i>=0) state.saved.splice(i,1);
  else { state.saved.unshift({key, mode:state.mode, picks:{...ms().picks}, level:state.level, infl:state.infl, mood:state.mood}); state.saved=state.saved.slice(0,60); toast(tr("savedToast")); }
  store.set("atlas-saved",state.saved); renderSaved(); updateSaveBtn();
};
$("savedList").onclick=e=>{
  const o=e.target.closest("[data-open]"), d=e.target.closest("[data-del]");
  if(o){ const s=state.saved[+o.dataset.open]; state.history.push(snapshot()); state.mode=s.mode; state.level=s.level; state.infl=s.infl; state.mood=s.mood; ms().picks={...s.picks}; savePrefs(); renderChrome(); render(true); }
  if(d){ state.saved.splice(+d.dataset.del,1); store.set("atlas-saved",state.saved); renderSaved(); updateSaveBtn(); }
};
document.addEventListener("keydown",e=>{
  if(e.code!=="Space"||e.ctrlKey||e.metaKey||e.altKey) return;
  const tag=(e.target.tagName||"").toUpperCase();
  if(["INPUT","SELECT","TEXTAREA","BUTTON"].includes(tag)||e.target.isContentEditable) return;
  e.preventDefault(); generate();
});
let rzT; new ResizeObserver(()=>{clearTimeout(rzT);rzT=setTimeout(drawPlate,80)}).observe($("plate"));

renderChrome();
assign(true);
render();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>drawPlate());
</script>
